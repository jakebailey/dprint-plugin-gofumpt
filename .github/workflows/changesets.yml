name: Changesets

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changesets:
    name: Changesets
    runs-on: ubuntu-latest

    environment: release

    if: github.repository == 'jakebailey/dprint-plugin-gofumpt'

    permissions:
      contents: write
      checks: read
      issues: read
      pull-requests: write
      id-token: write

    steps:
      - name: Obtain GitHub App token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: jakebailey/dprint-plugin-gofumpt
          identity: changesets

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.octo-sts.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Ensure a recent npm for OIDC trusted publishing to npmjs.com.
      - run: npm install -g npm@latest

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27

      - name: Capture new release version
        id: version
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/changeset-status.json"
          current_version=$(jq -r '.version' package.json)
          version=$(jq -r --arg current "$current_version" '.releases[0].newVersion // $current' "$RUNNER_TEMP/changeset-status.json")
          echo "version=$version" >> $GITHUB_OUTPUT

      - id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.octo-sts.outputs.token }}
          pr-title: 'Release v${{ steps.version.outputs.version }}'
          commit-message: 'Release v${{ steps.version.outputs.version }}'
          version-script: pnpm run version
          publish-script: pnpm changeset publish

      - name: Upload release assets
        if: steps.changesets.outputs.published == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            plugin.wasm
            metadata/schema.json
